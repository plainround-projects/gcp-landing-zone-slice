[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-landing-zone-slice"
version = "0.1.0"
description = "A landing-zone slice as code: folders, organization policies, a shared VPC and a service perimeter, with a tool that checks the design and simulates which control stops a request."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sumit Srivastava" }]
dependencies = ["pyyaml==6.0.3"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pip-audit>=2.7",
    "types-PyYAML",
]

[project.scripts]
landing-zone = "landing_zone.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "RUF", "PT", "S", "D100", "D101", "D103", "D104"]
# Named errors such as InvalidPolicy read as the condition they report; the suffix would only lengthen them.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# Test functions are named for the behavior they check; annotating every one adds noise, not safety.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: runs the command-line program as a subprocess against the repository's own design files",
]

[tool.coverage.run]
source = ["landing_zone"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.importlinter]
root_package = "landing_zone"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: interfaces -> infrastructure -> application -> domain, never upward"
type = "layers"
layers = [
    "landing_zone.interfaces",
    "landing_zone.infrastructure",
    "landing_zone.application",
    "landing_zone.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application read no files, parse no YAML and print nothing"
type = "forbidden"
source_modules = ["landing_zone.domain", "landing_zone.application"]
forbidden_modules = ["pathlib", "yaml", "json", "argparse", "subprocess"]
