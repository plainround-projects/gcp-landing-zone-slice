<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="708" viewBox="0 0 1200 708" role="img" aria-labelledby="t d">
<title id="t">The lesson's attack on the perimeter, step by step</title>
<desc id="d">Five numbered steps. data-reader runs gcloud storage cp to a bucket outside. IAM allows the read because the identity holds objectViewer. The perimeter sees the destination outside and raises RESOURCES_NOT_IN_SAME_SERVICE_PERIMETER. Enforced, Cloud Storage answers 403 and the violation is logged. In dry run the copy goes through and only the audit log shows it. A read from a machine with no access level is the same flow with NO_MATCHING_ACCESS_LEVEL. A principal with no read role is stopped by IAM and the perimeter is never consulted.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="707" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="706" rx="16"/>
<text class="title" x="48" y="68">The attack, end to end</text>
<text class="caption" x="48" y="100">IAM allows the read, so only the perimeter stops the copy. The warning rows are the two traps the lesson drills.</text>

<rect class="actor" x="396" y="128" width="128" height="48" rx="24"/>
<text class="lane" x="460" y="158" text-anchor="middle">data-reader</text>
<rect class="svc" x="555" y="128" width="110" height="48" rx="10"/>
<text class="lane" x="610" y="158" text-anchor="middle">IAM</text>
<rect class="svc" x="700" y="128" width="140" height="48" rx="10"/>
<text class="lane" x="770" y="158" text-anchor="middle">Perimeter</text>
<rect class="svc" x="865" y="128" width="150" height="48" rx="10"/>
<text class="lane" x="940" y="158" text-anchor="middle">Cloud Storage</text>
<rect class="svc" x="1028" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="1088" y="158" text-anchor="middle">Audit log</text>
<path class="hair" d="M460 176V624M610 176V624M770 176V560M940 176V496M1088 176V496"/>
<path class="hair" d="M66 216V600"/>
<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">The reader copies out</text>
<text class="sub" x="96" y="232">gcloud storage cp ... outside/</text>
<path class="sync" d="M460 216H610"/>
<text class="label t-accent" x="472" y="206">storage cp</text>
<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">IAM says yes</text>
<text class="sub" x="96" y="296">data-reader holds objectViewer</text>
<path class="sync" d="M610 280H770"/>
<text class="label t-accent" x="622" y="270">read allowed</text>
<circle class="dot" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">The perimeter checks the target</text>
<text class="sub" x="96" y="360">source inside, destination outside</text>
<rect class="slot" x="764" y="326" width="12" height="36" rx="4"/>
<rect class="mask" x="782" y="330" width="366" height="26" rx="4"/>
<text class="label b t-accent" x="788" y="349">RESOURCES_NOT_IN_SAME_SERVICE_PERIMETER</text>
<circle class="dot-g" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">3a</text>
<text class="label b t-ink" x="96" y="404">Enforced: refused</text>
<text class="sub" x="96" y="424">403, with a unique identifier</text>
<path class="ok" d="M770 408H460"/>
<text class="label t-good" x="476" y="398">403 prohibited</text>
<path class="sync" d="M770 408H1088"/>
<text class="label t-accent" x="786" y="398">violation logged</text>
<circle class="dot-w" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">3b</text>
<text class="label b t-warn" x="96" y="468">Dry run: the copy succeeds</text>
<text class="sub" x="96" y="488">same violation, only in the log</text>
<path class="fail" d="M770 472H940"/>
<text class="label t-warn" x="786" y="462">copy goes through</text>
<path class="fail" d="M940 472H1088"/>
<text class="label t-warn" x="952" y="462">dry-run entry</text>
<circle class="dot" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="532">Read from no access level</text>
<text class="sub" x="96" y="552">same flow, another reason</text>
<path class="sync" d="M460 536H770"/>
<text class="label t-accent" x="472" y="526">storage cat</text>
<rect class="slot" x="764" y="518" width="12" height="36" rx="4"/>
<rect class="mask" x="782" y="522" width="228" height="26" rx="4"/>
<text class="label b t-accent" x="788" y="541">NO_MATCHING_ACCESS_LEVEL</text>
<circle class="dot-w" cx="66" cy="600" r="15"/><text class="num" x="66" y="605" text-anchor="middle">5</text>
<text class="label b t-warn" x="96" y="596">No read role: IAM stops it</text>
<text class="sub" x="96" y="616">the perimeter is never consulted</text>
<path class="fail" d="M460 600H604"/>
<path class="stop" d="M610 588V612"/>
<text class="label t-warn" x="472" y="590">storage cp</text>
<text class="label t-warn" x="626" y="605">storage.objects.get</text>

<path class="sync" d="M48 664H112"/><text class="legend" x="124" y="669">sync call</text>
<path class="fail" d="M696 664H760"/><text class="legend" x="772" y="669">failure path</text>
<path class="ok" d="M928 664H992"/><text class="legend" x="1004" y="669">result</text>
</svg>
